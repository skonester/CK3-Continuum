name: Windows portable build
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 25
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Set up Rust
        run: rustup toolchain install 1.94.0 --profile minimal
      - name: Select Rust
        run: rustup override set 1.94.0
      - run: npm ci
      - run: npm run native:build
      - run: npm run build
      - run: npm test
      - run: npm run test:desktop
      - name: Package portable Windows executable
        id: package
        shell: pwsh
        run: |
          $package = Get-Content package.json -Raw | ConvertFrom-Json
          "output_dir=$($package.build.directories.output)" >> $env:GITHUB_OUTPUT
          "version=$($package.version)" >> $env:GITHUB_OUTPUT
          npx electron-builder --win --x64 --publish never
      - name: Verify packaged app functionality
        shell: pwsh
        run: |
          $env:CONTINUUM_EXE = Join-Path $PWD '${{ steps.package.outputs.output_dir }}/win-unpacked/CK3 Continuum.exe'
          npm run test:desktop
      - name: Verify standalone portable executable
        run: npm run test:portable
      - uses: actions/upload-artifact@v4
        with:
          name: ck3-continuum-windows-x64-portable
          path: ${{ steps.package.outputs.output_dir }}/*.exe
          if-no-files-found: error
          compression-level: 0
  release:
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ck3-continuum-windows-x64-portable
          path: release-assets
      - name: Publish Windows executable to GitHub Releases
        uses: softprops/action-gh-release@v3
        with:
          tag_name: v${{ needs.build.outputs.version }}
          name: CK3 Continuum v${{ needs.build.outputs.version }}
          target_commitish: ${{ github.sha }}
          files: release-assets/*.exe
          fail_on_unmatched_files: true
          overwrite_files: true
          make_latest: true
          body: |
            Download the Windows x64 portable .exe below and run it directly. No installation, Node.js, Rust, or separate resource folder is required.

            See the repository README for conversion instructions and the separately provided reference save.

            Build commit: ${{ github.sha }}
